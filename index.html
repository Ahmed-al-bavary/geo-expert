<style>
/* Layout: header with language switch, three tabs (guide, flag quiz, capital quiz). Guide is a searchable card grid; quizzes are one centered card with a typed answer */
/* Palette: ink-navy and warm gold. Light = parchment and navy; dark = midnight and gold. */
:root {
  --bg: #F3EFE6;
  --surface: #FFFFFF;
  --surface2: #F8F5EE;
  --ink: #131C33;
  --muted: #5F687C;
  --line: #E3DDCE;
  --accent: #1C2C52;
  --accent-ink: #F6E7BE;
  --accent-soft: #ECE4CF;
  --gold: #A67A10;
  --glow: rgba(196, 150, 40, .16);
  --warn: #9A4A12;
  --good: #1B7A47;
  --good-soft: #DDF2E5;
  --bad: #B3261E;
  --bad-soft: #FBE4E0;
  --sea: #D9E4EE;
  --land: #FBF8F1;
  --landline: #98A6BC;
  --shadow: 0 1px 2px rgba(19, 28, 51, .06), 0 8px 24px rgba(19, 28, 51, .07);
  --bgop: .2;
  --font-display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090F1C; --surface: #121B2E; --surface2: #0E1627; --ink: #EDF0F7; --muted: #99A4BC; --line: #23304B;
    --accent: #E8B64C; --accent-ink: #1C1403; --accent-soft: #2B2410; --gold: #E8B64C; --glow: rgba(232, 182, 76, .13);
    --warn: #F2A268; --good: #5BD39A; --good-soft: #0F3325; --bad: #FF8F86; --bad-soft: #3D1B1D;
    --sea: #0B1527; --land: #25345A; --landline: #40517C; --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35); --bgop: .26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090F1C; --surface: #121B2E; --surface2: #0E1627; --ink: #EDF0F7; --muted: #99A4BC; --line: #23304B;
  --accent: #E8B64C; --accent-ink: #1C1403; --accent-soft: #2B2410; --gold: #E8B64C; --glow: rgba(232, 182, 76, .13);
  --warn: #F2A268; --good: #5BD39A; --good-soft: #0F3325; --bad: #FF8F86; --bad-soft: #3D1B1D;
  --sea: #0B1527; --land: #25345A; --landline: #40517C; --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35); --bgop: .26;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  background-image: radial-gradient(900px 380px at 50% -140px, var(--glow), transparent 70%);
  background-repeat: no-repeat;
  padding-block: 20px calc(104px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 1100px; margin: 0 auto; position: relative; }
.lbmask { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 9, 18, .6); }
.lbmask[hidden] { display: none; }
.lbsheet { width: min(100%, 560px); max-height: 88vh; overflow-y: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
.lbhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lbhead h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.lbx { width: 36px; height: 36px; cursor: pointer; color: var(--ink); background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; font-size: 1.1rem; }
.lbname { display: flex; gap: 8px; margin: 12px 0 4px; }
.lbname input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface2); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; }
.lbname .btn { padding: 9px 18px; }
.lbnote { color: var(--muted); font-size: .85rem; margin: 6px 0; }
.lbmsg { text-align: center; color: var(--muted); padding: 22px 8px; }
.lbrows { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.lbrow { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); }
.lbrow.me { border-color: var(--gold); background: var(--accent-soft); }
.lbrow .rk { font-weight: 700; text-align: center; color: var(--gold); }
.lbrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.lbrow .sc { text-align: end; font-variant-numeric: tabular-nums; line-height: 1.3; }
.lbrow .sc small { display: block; color: var(--muted); font-size: .78rem; }
.bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; color: var(--gold); opacity: var(--bgop); }
.bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tools { display: flex; gap: 6px; flex: none; align-items: center; }
.themebtn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); padding: 0; }
.themebtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.themebtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.qcard { position: relative; isolation: isolate; overflow: hidden; }
.qcard::before { content: ""; position: absolute; z-index: -1; inset-block-start: 0; inset-inline-end: 0; width: 55%; height: 45%; pointer-events: none; color: var(--gold); opacity: .22;
  background-image: radial-gradient(currentColor 1.1px, transparent 1.6px); background-size: 12px 12px;
  -webkit-mask-image: radial-gradient(circle at 100% 0, #000, transparent 70%); mask-image: radial-gradient(circle at 100% 0, #000, transparent 70%); }
h1 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em; font-size: clamp(1.35rem, 5.6vw, 2.4rem); margin: 0; white-space: nowrap; line-height: 1.25; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sub { color: var(--muted); margin: 6px 0 18px; font-size: .95rem; }
button { font: inherit; }
.langbtn { flex: none; cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .85rem; box-shadow: var(--shadow); }
.tabs { position: fixed; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  inset-inline: 0; margin-inline: auto; width: min(calc(100% - 24px), 520px);
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: var(--shadow); }
.tab { min-width: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); background: transparent; border: 0; border-radius: 16px; padding: 8px 2px 6px; font-weight: 500; font-size: .72rem; line-height: 1.2; transition: background .2s, color .2s; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tab:focus-visible, .chip:focus-visible, select:focus-visible, .opt:focus-visible, .btn:focus-visible, .say:focus-visible, .langbtn:focus-visible, .linkbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.search input, .ans {
  width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 18px; outline: none; box-shadow: var(--shadow);
}
.search input:focus-visible, .ans:focus-visible { border-color: var(--gold); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input::placeholder, .ans::placeholder { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 6px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; min-width: 0; }
#chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -16px; padding-inline: 16px; }
#chips::-webkit-scrollbar { display: none; }
#chips .chip { flex: none; }
.controls #chips { flex-basis: 100%; }
.chip { font-weight: 500; font-size: .9rem; cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 15px; transition: background .15s, color .15s; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { font: inherit; font-size: .92rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; max-width: 100%; }
.count { color: var(--muted); font-size: .92rem; margin: 10px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.title { display: flex; gap: 12px; align-items: center; min-width: 0; }
.flag { font-size: 2.4rem; line-height: 1; }
.name { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; line-height: 1.3; }
.alt { color: var(--muted); font-size: .85rem; }
.cont { font-size: .74rem; font-weight: 500; color: var(--gold); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin: 0; }
dl div { min-width: 0; }
dt { color: var(--muted); font-size: .76rem; letter-spacing: .03em; }
dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.wide { grid-column: 1 / -1; }
.who { color: var(--warn); }
.caprow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.say { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--gold); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 3px 12px; font-size: .85rem; font-weight: 500; }
.say svg { width: 16px; height: 16px; fill: currentColor; }

.quiz { max-width: 640px; margin: 0 auto; }
.qtop { display: flex; justify-content: space-between; color: var(--muted); font-size: .92rem; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); width: 0; border-radius: 99px; transition: width .3s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 26px 18px; text-align: center; box-shadow: var(--shadow); }
.qtext { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; margin: 0 0 6px; text-wrap: balance; }
.qflag { font-size: clamp(5rem, 28vw, 8rem); line-height: 1.15; margin: 4px 0 10px; }
.qflag.small { font-size: 2.6rem; margin: 0; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; margin-top: 14px; }
.opt { cursor: pointer; min-height: 52px; color: var(--ink); background: var(--surface2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; font-weight: 500; font-size: 1.02rem; overflow-wrap: anywhere; }
.ans { text-align: center; margin-top: 12px; }
.ans:disabled { opacity: .8; }
.ans.good { border-color: var(--good); background: var(--good-soft); }
.ans.bad { border-color: var(--bad); background: var(--bad-soft); }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
.fb { min-height: 1.6em; margin: 12px 0 0; font-weight: 700; overflow-wrap: anywhere; }
.fb.good { color: var(--good); } .fb.bad { color: var(--bad); }
.btn { cursor: pointer; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; padding: 12px 28px; font-weight: 600; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform .1s; }
.btn:active { transform: scale(.97); }
.btn.ghost { color: var(--muted); background: transparent; border: 1px solid var(--line); font-weight: 500; box-shadow: none; }
.linkbtn { cursor: pointer; margin-top: 14px; color: var(--muted); background: transparent; border: 0; text-decoration: underline; font-size: .9rem; }
.score { font-family: var(--font-display); font-weight: 800; color: var(--gold); font-size: 3.4rem; margin: 6px 0; font-variant-numeric: tabular-nums; }
.miss { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; text-align: start; }
.miss li { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; }
.misshead { margin: 18px 0 0; font-weight: 700; text-align: start; }
.mapbox { position: relative; width: 100%; height: clamp(190px, 54vw, 360px); margin: 10px 0 0; background: var(--sea); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }

.land.good { fill: var(--good); }
.land.bad { fill: var(--bad); }

.dot { fill: none; stroke: var(--gold); }
.dot.good { fill: var(--good); stroke: var(--good); }
.dot.bad { fill: var(--bad); stroke: var(--bad); }
.hit { fill: transparent; stroke: none; pointer-events: all; }
.mapmsg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; color: var(--muted); }
.mapmsg p { margin: 0; }
.zoom { position: absolute; top: 8px; inset-inline-end: 8px; display: flex; flex-direction: column; gap: 6px; }
.zbtn { width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; touch-action: manipulation; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.zbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.qcard .alt { margin: 0; }
.qtimer { font-weight: 700; color: var(--ink); }
.rec { margin: 10px 0; padding: 10px 12px; font-weight: 700; color: var(--good); background: var(--good-soft); border: 1.5px solid var(--good); border-radius: 12px; }
.duel .linkbtn { display: none; }
.pname { text-align: center; font-family: var(--font-display); font-weight: 700; color: var(--gold); margin-bottom: 8px; overflow-wrap: anywhere; }
.names { display: grid; gap: 8px; margin-bottom: 4px; }
.names .ans { margin-top: 0; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.vs > div { min-width: 0; overflow-wrap: anywhere; background: var(--surface2); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 8px; }
.vs > div.win { border-color: var(--good); background: var(--good-soft); }
.vs b { display: block; font-family: var(--font-display); }
.vs .big { font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0 0 10px; }
.stp { font-size: .8rem; padding: 2px 12px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); }
.stp.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.drow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.drow > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.marks { display: flex; gap: 8px; flex: none; font-weight: 800; }
.m1 { color: var(--good); }
.m0 { color: var(--bad); }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 48px; height: 48px; flex: none; }
.fimg { display: block; height: auto; aspect-ratio: 4 / 3; object-fit: contain; border: 1px solid var(--line); border-radius: 4px; background: var(--surface2); }
.flag .fimg { width: 64px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); border: 0; }
